[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mathfuncs"
version = "0.0.1"
description = "Commonly used mathematical functions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "pre-commit",
    "ruff",
]

[tool.hatch.build.targets.wheel]
# Build `mathfuncs` library
packages = ["src/python/mathfuncs"]

# Put these directories on sys.path so `import mathfuncs` and `import solutions` work
dev-mode-dirs = ["src", "src/python"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["mathfuncs"]
